<section class="auth-section">
    <div class="auth-card">
        <h2>Crea tu cuenta</h2>
        <p class="auth-subtitle">Únete a nuestra comunidad de adoptantes.</p>
        <div id="register-message"></div>
        <form id="register-form">
            <div class="form-group">
                <label for="reg-name">Nombre de usuario</label>
                <input type="text" id="reg-name" required placeholder="Tu nombre">
            </div>
            <div class="form-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" required placeholder="ejemplo@correo.com">
            </div>
            <div class="form-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" required placeholder="Mínimo 6 caracteres">
            </div>
            <button type="submit" class="btn">Registrarse</button>
        </form>
        <p class="auth-footer">¿Ya eres miembro? <a href="#login">Inicia sesión aquí</a></p>
    </div>
</section>
