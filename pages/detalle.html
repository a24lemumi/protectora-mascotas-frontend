<div class="pet-details-container">
    <button class="btn btn-outline" data-action="navigate" data-target="#catalog" style="margin-bottom: 2rem;">← Volver al catálogo</button>
    
    <div class="pet-details-card">
        <div class="pet-details-image">
            <img id="detail-img" src="" alt="Mascota">
        </div>
        <div class="pet-details-info">
            <div class="info-header">
                <span id="detail-species" class="badge">Especie</span>
                <h1 id="detail-name">Nombre de la Mascota</h1>
                <p id="detail-breed" class="text-secondary">Raza</p>
            </div>
            
            <div class="info-content">
                <div class="info-item">
                    <strong>Estado:</strong>
                    <span>Disponible para adopción</span>
                </div>
                <p id="detail-description" class="text-secondary" style="margin-top: 1.5rem;">
                    Esta mascota está buscando un hogar lleno de amor. Es sociable, cariñosa y está esperando conocerte.
                </p>
            </div>

            <div class="info-actions" style="margin-top: 2.5rem;">
                <button id="detail-adopt-btn" class="btn btn-primary" style="width: 100%;">¡Quiero Adoptar!</button>
            </div>
        </div>
    </div>
</div>
