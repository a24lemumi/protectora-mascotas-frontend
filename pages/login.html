<section class="auth-section">
    <div class="auth-card">
        <h2>¡Hola de nuevo!</h2>
        <p class="auth-subtitle">Introduce tus datos para acceder.</p>
        <div id="login-message"></div>
        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" name="email" required placeholder="ejemplo@correo.com">
            </div>
            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary">Entrar en mi cuenta</button>
        </form>
        <p class="auth-footer">¿Aún no tienes cuenta? <a href="#register">Regístrate gratis</a></p>
    </div>
</section>
