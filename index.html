<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Protectora de Mascotas - Encuentra tu compañero ideal. Adopta, no compres."
    />
    <title>Protectora de Mascotas | Adopta un amigo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <header>
      <nav data-state="logged-out">
        <a href="#home" class="logo"> Protectora </a>
        <ul class="nav-links">
          <li><a href="#home">Inicio</a></li>
          <li><a href="#catalog">Catálogo</a></li>
          <li class="admin-link"><a href="#admin">Panel Admin</a></li>
          <li class="login-btn">
            <a href="#login" class="btn btn-outline">Login</a>
          </li>
          <li class="register-btn">
            <a href="#register" class="btn btn-primary">Registro</a>
          </li>
          <li><button id="theme-toggle" aria-label="Cambiar tema"></button></li>
          <li class="logout-btn">
            <button data-action="logout" class="logout-link">
              Cerrar Sesión
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <main id="app-main">
      <!-- Home View -->
      <section id="view-home" class="view active">
        <div class="home-hero">
          <div class="hero-content">
            <h1>Adopta un amigo para siempre</h1>
            <p>
              Transforma una vida y la tuya propia. Descubre las mascotas que
              esperan un hogar lleno de amor.
            </p>
            <div class="hero-actions">
              <button
                class="btn btn-primary"
                data-action="navigate"
                data-target="#catalog"
              >
                Explorar Catálogo
              </button>
              <button
                class="btn btn-outline"
                data-action="navigate"
                data-target="#register"
              >
                Unirme ahora
              </button>
            </div>
          </div>
          <div class="hero-image">
            <img
              src="imagenes/hero-pets.png"
              alt="Mascotas felices"
              id="hero-img"
            />
          </div>
        </div>
      </section>

      <!-- Catalog View -->
      <section id="view-catalog" class="view"></section>

      <!-- Details View -->
      <section id="view-details" class="view"></section>

      <!-- Auth View (for Login/Register) -->
      <section id="view-auth" class="view"></section>

      <!-- Admin View -->
      <section id="view-admin" class="view"></section>
    </main>

    <footer>
      <p>
        &copy; 2026 Protectora de Mascotas. Cuidando de ellos, pensando en ti.
      </p>
    </footer>

    <script src="js/api.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
